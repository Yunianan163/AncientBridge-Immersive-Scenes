<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包语音对话系统 - 网页版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }
        
        .status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dc3545;
        }
        
        .status.connected::before {
            background: #28a745;
        }
        
        .status.error::before {
            background: #dc3545;
        }
        
        .recording-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            color: #dc3545;
            font-size: 14px;
            font-weight: 500;
        }
        
        .recording-indicator.active {
            display: flex;
        }
        
        .pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 10px rgba(220, 53, 69, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(220, 53, 69, 0);
            }
        }
        
        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            max-width: 80%;
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .message.ai {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .message.ai.streaming {
            border-left: 3px solid #667eea;
        }
        
        .message.system {
            background: #e9ecef;
            color: #666;
            text-align: center;
            margin: 10px auto;
            font-size: 12px;
            max-width: 90%;
        }
        
        .message.interim {
            opacity: 0.7;
        }
        
        .controls {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #c82333;
        }
        
        .text-input-group {
            display: flex;
            gap: 10px;
        }
        
        .text-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .text-input:focus {
            border-color: #667eea;
        }
        
        .features {
            padding: 20px 30px;
            background: #f8f9fa;
            font-size: 12px;
            color: #666;
        }
        
        .features h3 {
            margin-bottom: 10px;
            color: #333;
        }
        
        .features ul {
            margin-left: 20px;
        }
        
        .features li {
            margin-bottom: 5px;
        }
        
        /* 滚动条样式 */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
        
        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                min-height: 100vh;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .chat-container {
                height: calc(100vh - 350px);
            }
            
            .button-group {
                flex-wrap: wrap;
            }
            
            .btn {
                font-size: 12px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="voiceDialogContainer">
        <div class="header" id="voiceDialogHeader">
            <h1>🎙️ 豆包语音对话系统</h1>
            <p>与AI进行自然语音对话</p>
        </div>
        
        <div class="status-bar">
            <span id="connectionStatus" class="status">未连接</span>
            <span id="statusIndicator" class="recording-indicator">
                <span class="pulse"></span>
                正在录音...
            </span>
        </div>
        
        <div id="chatContainer" class="chat-container">
            <div class="message system">欢迎使用语音对话系统！请先连接服务器开始对话。</div>
        </div>
        
        <div class="controls">
            <div class="button-group">
                <button id="btnConnect" class="btn btn-primary">
                    <span>🔌</span> 连接服务器
                </button>
                <button id="btnVoiceChat" class="btn btn-secondary" disabled>
                    <span>🎤</span> 语音对话
                </button>
                <button id="btnStop" class="btn btn-danger" disabled>
                    <span>⏹️</span> 停止
                </button>
            </div>
            
            <div class="text-input-group">
                <input 
                    type="text" 
                    id="textInput" 
                    class="text-input" 
                    placeholder="输入文字消息，按回车发送..."
                >
                <button id="btnSendText" class="btn btn-primary" style="flex: 0 0 auto; padding: 12px 24px;">
                    发送
                </button>
            </div>
        </div>
        
        <div class="features" id="voiceDialogFeatures">
            <h3>使用说明：</h3>
            <ul>
                <li>点击"连接服务器"按钮建立WebSocket连接</li>
                <li>点击"语音对话"开始语音交互，说话时会自动打断AI</li>
                <li>支持文字输入，按回车键发送</li>
                <li>语音角色：沧朔 - 古桥历史小向导</li>
            </ul>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
    <script>
        // 检测是否通过 iframe 嵌入并需要自动启动
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('autostart') === '1') {
            // 隐藏标题和说明，只保留核心对话区域
            document.querySelector('.header').style.display = 'none';
            document.querySelector('.features').style.display = 'none';
            document.querySelector('.container').style.borderRadius = '0';
            document.querySelector('.container').style.maxWidth = '100%';
            document.querySelector('.container').style.height = '100vh';
            document.querySelector('.container').style.display = 'flex';
            document.querySelector('.container').style.flexDirection = 'column';
            document.querySelector('.chat-container').style.flex = '1';
            document.querySelector('.chat-container').style.height = 'auto';
            document.body.style.padding = '0';
            document.body.style.background = '#f8f9fa';
        }
    </script>
</body>
</html>
